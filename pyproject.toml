[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tux"
version = "0.1.0"
description = "Terminal-native Linux assistant"
requires-python = ">=3.11"

[project.scripts]
tux = "tux.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["tux*"]
